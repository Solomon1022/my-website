name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify core files present
        run: |
          test -s index.html
          test -s learn.html
          test -s api/deepseek-proxy.js
          echo "Core files OK"
